<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Connexion - Bibliothèque Universitaire</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #8e9eab, #eef2f3);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .login-box {
      background: white;
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 400px;
      width: 100%;
      animation: fadeIn 0.8s ease-in-out;
    }

    h1 {
      margin-bottom: 1rem;
      color: #333;
    }

    input[type="email"] {
      width: 90%;
      padding: 0.8rem;
      margin: 0.5rem 0;
      border: 1px solid #ccc;
      border-radius: 0.5rem;
      transition: border 0.3s ease;
    }

    input[type="email"]:focus {
      border-color: #007BFF;
    }

    button {
      background-color: #007BFF;
      color: white;
      padding: 0.8rem 2rem;
      border: none;
      border-radius: 0.5rem;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    button:hover {
      background-color: #0056b3;
    }

    .message {
      margin-top: 1rem;
      color: red;
      font-weight: bold;
      display: none;
    }

    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(20px);}
      to {opacity: 1; transform: translateY(0);}
    }
  </style>
  <script>
    function redirigerParEmail(event) {
      event.preventDefault();
      const emailInput = document.getElementById("email");
      const email = emailInput.value.trim();
      const messageBox = document.getElementById("message");
      const bouton = document.getElementById("btnConnexion");

      bouton.disabled = true;
      messageBox.style.display = "none";

      setTimeout(() => {
        if (email.endsWith("@email.bibliothecaire.com")) {
          window.location.href = "admin.html";
        } else if (email.endsWith("@email.com")) {
          window.location.href = "welcome.html";
        } else {
          messageBox.textContent = "Adresse email invalide.";
          messageBox.style.display = "block";
          bouton.disabled = false;
        }
      }, 800); // effet de délai pour l'expérience utilisateur
    }
  </script>
</head>
<body>
  <div class="login-box">
    <h1>Connexion</h1>
    <form onsubmit="redirigerParEmail(event)">
      <input type="email" id="email" name="email" placeholder="Votre adresse email" required />
      <br />
      <button type="submit" id="btnConnexion">Se connecter</button>
    </form>
    <div id="message" class="message"></div>
    <p>Pas encore inscrit ? <a href="register.html">Créer un compte</a></p>
  </div>
</body>
</html>
