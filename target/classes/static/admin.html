<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin - Gestion des Réservations</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f2f5;
      margin: 0;
    }

    header {
      background-color: #343a40;
      color: white;
      padding: 1rem;
      text-align: center;
    }

    .container {
      padding: 2rem;
    }

    .reservation {
      background: white;
      border-left: 6px solid #007bff;
      padding: 1rem;
      margin-bottom: 1rem;
      border-radius: 0.5rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .reservation h3 {
      margin: 0 0 0.5rem;
    }

    .reservation p {
      margin: 0.3rem 0;
    }

    .actions {
      margin-top: 0.5rem;
    }

    button {
      margin-right: 0.5rem;
      padding: 0.4rem 1rem;
      border: none;
      border-radius: 0.3rem;
      cursor: pointer;
      color: white;
    }

    .valider {
      background-color: #28a745;
    }

    .annuler {
      background-color: #dc3545;
    }

    .pret {
      background-color: #17a2b8;
    }
  </style>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      chargerReservations();
    });

    function chargerReservations() {
      fetch("/api/admin/reservations")
        .then(res => res.json())
        .then(data => {
          const container = document.getElementById("reservations");
          container.innerHTML = "";

          data.forEach(res => {
            const div = document.createElement("div");
            div.className = "reservation";
            div.innerHTML = `
              <h3>${res.livreTitre}</h3>
              <p>Réservé par : ${res.utilisateurEmail}</p>
              <p>Date de réservation : ${res.date}</p>
              <div class="actions">
                <button class="valider" onclick="validerReservation(${res.id})">Valider</button>
                <button class="pret" onclick="enregistrerPretSOAP(${res.id})">Prêter (SOAP)</button>
                <button class="annuler" onclick="annulerReservation(${res.id})">Annuler</button>
              </div>
            `;
            container.appendChild(div);
          });
        })
        .catch(() => {
          document.getElementById("reservations").innerHTML = "Erreur de chargement.";
        });
    }

    function validerReservation(id) {
      fetch(`/api/admin/valider/${id}`, { method: "POST" })
        .then(res => {
          if (res.ok) {
            alert("Réservation validée !");
            chargerReservations();
          } else {
            alert("Erreur lors de la validation.");
          }
        });
    }

    function annulerReservation(id) {
      fetch(`/api/admin/reservations/${id}`, { method: "DELETE" })
        .then(res => {
          if (res.ok) {
            alert("Réservation annulée.");
            chargerReservations();
          } else {
            alert("Échec de l’annulation.");
          }
        });
    }

    function enregistrerPretSOAP(id) {
      // Simulation appel SOAP (dans une vraie appli, cela serait un POST XML)
      alert("SOAP: Prêt enregistré pour la réservation ID " + id);
    }
  </script>
</head>
<body>
  <header>
    <h1>Administration - Réservations et Prêts</h1>
  </header>

  <div class="container">
    <div id="reservations">
      Chargement des réservations en cours...
    </div>
  </div>
</body>
</html>
